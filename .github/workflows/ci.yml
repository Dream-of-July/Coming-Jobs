name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/build-release.mjs
      - run: node scripts/check-public.mjs
      - run: node scripts/install.mjs --verify-only
      - run: node --no-warnings --test plugins/coming-jobs/tests/*.test.mjs
